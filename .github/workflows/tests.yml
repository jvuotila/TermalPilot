name: Tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
      - run: node --check custom_components/thermal_pilot/frontend/panel.js
      - run: node tests/test_panel.cjs
      - run: node tests/test_live_panel.cjs
      - run: node --check custom_components/thermal_pilot/frontend/heat-retention-card.js
      - run: node tests/test_retention_card.cjs
